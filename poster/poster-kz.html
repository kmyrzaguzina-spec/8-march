<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Каратэ WKF бойынша шеберлік сыныбы — Софья Берульцева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9eef6; }
  body { display: flex; justify-content: center; }

  .poster {
    --ink: #0d1b3d;
    --red: #e8322f;
    --blue: #2b7bff;
    --bronze-1: #f4c38a;
    --bronze-2: #cd7f32;
    position: relative;
    width: 794px;
    height: 1123px;
    overflow: hidden;
    background:
      radial-gradient(60% 40% at 100% 0%, rgba(43,123,255,.12) 0%, rgba(43,123,255,0) 100%),
      radial-gradient(50% 35% at 0% 100%, rgba(232,50,47,.10) 0%, rgba(232,50,47,0) 100%),
      linear-gradient(180deg, #ffffff 0%, #f1f5fb 100%);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
  }

  /* ---------- decor ---------- */
  .sun {
    position: absolute;
    left: 268px; top: 214px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6a55 0%, var(--red) 55%, #c4201e 100%);
    box-shadow: 0 30px 80px rgba(232,50,47,.25);
    z-index: 1;
  }
  .ghost {
    position: absolute;
    right: -18px; top: 250px;
    writing-mode: vertical-rl;
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 128px;
    letter-spacing: .02em;
    color: rgba(13,27,61,.05);
    z-index: 0;
  }

  /* ---------- header ---------- */
  .header {
    position: absolute;
    top: 34px; left: 40px; right: 40px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 5;
  }
  .brand {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 15px; letter-spacing: .14em;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
  }
  .tag {
    font-weight: 700; font-size: 13px; letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--red);
  }

  /* ---------- title ---------- */
  .title {
    position: absolute;
    left: 40px; right: 40px; top: 58px;
    z-index: 4;
  }
  .title .kicker {
    font-weight: 800; font-size: 14px; letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(13,27,61,.55);
    margin-bottom: 10px;
  }
  .title h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  .title h1 span {
    display: inline-flex; align-items: center; gap: 16px;
    color: var(--red);
    font-size: 42px;
    margin-top: 6px;
  }
  .title h1 span.pre {
    display: flex;
    font-size: 36px;
    margin: 0 0 12px;
  }
  .title h1 span i {
    display: inline-block; width: 50px; height: 7px;
    background: linear-gradient(90deg, var(--red) 50%, var(--blue) 50%);
  }

  /* ---------- athlete cut-out ---------- */
  .athlete {
    position: absolute;
    left: -168px; top: 208px;
    width: 998px;
    z-index: 2;
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 97%);
    mask-image: linear-gradient(180deg, #000 80%, transparent 97%);
    filter: drop-shadow(0 20px 30px rgba(13,27,61,.18));
  }

  /* ---------- name block ---------- */
  .who {
    position: absolute;
    left: 36px; top: 572px;
    width: 262px;
    z-index: 4;
  }
  .who .name {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 27px;
    line-height: 1.08;
    text-transform: uppercase;
  }
  .who .medal {
    margin-top: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .who .coin {
    flex: none;
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--bronze-1), var(--bronze-2) 50%, #7d4317);
    box-shadow: 0 4px 10px rgba(125,67,23,.35), inset 0 -3px 6px rgba(70,30,5,.6), inset 0 3px 5px rgba(255,235,200,.6);
    display: grid; place-items: center;
    font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 17px; color: #3a1a05;
  }
  .who .medal-txt {
    font-weight: 700; font-size: 15px; line-height: 1.3;
  }
  .who .medal-txt b { color: var(--bronze-2); font-weight: 800; }

  .who .titles {
    list-style: none;
    margin-top: 16px;
    display: flex; flex-direction: column; gap: 11px;
  }
  .who .titles li {
    position: relative;
    padding-left: 20px;
    font-weight: 600; font-size: 14.5px; line-height: 1.28;
    color: var(--ink);
  }
  .who .titles li::before {
    content: '';
    position: absolute; left: 0; top: 4px;
    width: 11px; height: 11px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--bronze-1), var(--bronze-2) 55%, #7d4317);
  }
  .who .titles b { font-weight: 800; color: var(--bronze-2); }

  /* ---------- bottom card ---------- */
  .card {
    position: absolute;
    left: 28px; right: 28px; bottom: 28px;
    height: 200px;
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 -6px 40px rgba(13,27,61,.12);
    z-index: 3;
    padding: 34px 36px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .card .pin {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--red);
    display: grid; place-items: center;
    margin-bottom: 16px;
  }
  .card .pin svg { width: 26px; height: 26px; }
  .card .label {
    font-weight: 700; font-size: 12px; letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(13,27,61,.55);
  }
  .card .value {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900; font-size: 30px; letter-spacing: .02em;
    margin-top: 6px;
  }

  /* ---------- victory polaroid ---------- */
  .polaroid {
    position: absolute;
    right: 46px; bottom: 70px;
    width: 300px;
    padding: 10px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(13,27,61,.25);
    transform: rotate(4deg);
    z-index: 5;
  }
  .polaroid .img {
    height: 230px;
    border-radius: 8px;
    background: url('sofia-win.jpg') 66% 30% / auto 128% no-repeat;
    filter: brightness(1.18) contrast(1.05) saturate(1.05);
  }
  .polaroid .cap {
    margin-top: 10px;
    text-align: center;
    font-weight: 800; font-size: 12px; letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--blue);
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="ghost">KARATE</div>
    <div class="sun"></div>

    <div class="title">
      <h1><span class="pre"><i></i>Каратэ WKF бойынша</span>Шеберлік сыныбы</h1>
    </div>

    <img class="athlete" src="sofia-medal-cut.png" alt="Софья Берульцева">

    <div class="who">
      <div class="name">Софья<br>Берульцева</div>
      <ul class="titles">
        <li><b>Grand Winner</b> жүлдесінің иегері</li>
        <li><b>2 дүркін</b> Азия ойындарының жеңімпазы</li>
        <li><b>Әлем чемпионатының</b> жүлдегері</li>
        <li><b>Олимпиада ойындарының</b> жүлдегері</li>
      </ul>
    </div>

    <div class="polaroid">
      <div class="img"></div>
    </div>
  </div>
</body>
</html>
