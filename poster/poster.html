<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мастер-класс по каратэ — София Берульцева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0d0420; }
  body { display: flex; justify-content: center; }

  .poster {
    --bronze-1: #f4c38a;
    --bronze-2: #cd7f32;
    --bronze-3: #8a4b1c;
    position: relative;
    width: 794px;           /* A4 @ 96dpi */
    height: 1123px;
    overflow: hidden;
    background: radial-gradient(120% 70% at 50% 100%, #3b1675 0%, #1c0940 55%, #10052a 100%);
    font-family: 'Montserrat', sans-serif;
    color: #fff;
  }

  /* ---------- photo ---------- */
  .photo {
    position: absolute;
    inset: 0 0 auto 0;
    height: 760px;
    background: url('sofia.jpg') center 8% / cover no-repeat;
  }
  .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(16,5,42,.85) 0%, rgba(16,5,42,.0) 18%),
      linear-gradient(0deg, #1c0940 0%, rgba(28,9,64,.92) 14%, rgba(28,9,64,.0) 45%),
      linear-gradient(90deg, rgba(16,5,42,.55) 0%, rgba(16,5,42,0) 22%, rgba(16,5,42,0) 78%, rgba(16,5,42,.55) 100%);
  }

  /* ---------- header ---------- */
  .header {
    position: absolute;
    top: 34px; left: 40px; right: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 3;
  }
  .brand {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .14em;
    padding: 10px 18px;
    border: 1.5px solid rgba(255,255,255,.85);
    border-radius: 999px;
    background: rgba(16,5,42,.35);
    backdrop-filter: blur(4px);
  }
  .tag {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--bronze-1);
  }

  /* ---------- vertical side text ---------- */
  .side {
    position: absolute;
    left: 30px; top: 150px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 54px;
    letter-spacing: .08em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255,255,255,.55);
    z-index: 2;
  }

  /* ---------- bronze badge ---------- */
  .badge {
    position: absolute;
    right: 38px; top: 300px;
    width: 168px; height: 168px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, var(--bronze-1) 0%, var(--bronze-2) 45%, var(--bronze-3) 100%);
    box-shadow:
      0 0 0 6px rgba(205,127,50,.25),
      0 18px 40px rgba(0,0,0,.45),
      inset 0 -8px 18px rgba(80,35,5,.55),
      inset 0 6px 14px rgba(255,235,200,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #3a1a05;
    transform: rotate(-8deg);
    z-index: 3;
  }
  .badge::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px dashed rgba(58,26,5,.45);
  }
  .badge .rings { display: flex; gap: 2px; margin-bottom: 6px; }
  .badge .rings span {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2.5px solid #3a1a05;
    margin: 0 -3px;
  }
  .badge .rings span:nth-child(even) { transform: translateY(6px); }
  .badge b {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: .04em;
    margin-top: 6px;
  }
  .badge small {
    font-weight: 800;
    font-size: 10.5px;
    letter-spacing: .12em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  /* ---------- main text ---------- */
  .content {
    position: absolute;
    left: 48px; right: 48px;
    bottom: 44px;
    z-index: 3;
  }
  .kicker {
    display: inline-block;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #1c0940;
    background: linear-gradient(90deg, var(--bronze-1), var(--bronze-2));
    padding: 8px 16px;
    border-radius: 4px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 84px;
    line-height: .95;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  h1 .accent {
    display: block;
    font-size: 58px;
    background: linear-gradient(90deg, var(--bronze-1) 0%, var(--bronze-2) 60%, #e9a565 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-top: 6px;
  }

  .person {
    margin-top: 30px;
    padding-left: 20px;
    border-left: 4px solid var(--bronze-2);
  }
  .person .name {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.05;
    text-transform: uppercase;
  }
  .person .title {
    margin-top: 10px;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.35;
    color: rgba(255,255,255,.88);
  }
  .person .title strong { color: var(--bronze-1); font-weight: 800; }

  .place {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-radius: 16px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.18);
  }
  .place .pin {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bronze-1), var(--bronze-2));
    display: grid; place-items: center;
  }
  .place .pin svg { width: 24px; height: 24px; }
  .place .label {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: rgba(255,255,255,.65);
  }
  .place .value {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .04em;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="photo"></div>

    <div class="header">
      <div class="brand">NEOTECH SCHOOL</div>
      <div class="tag">Каратэ · Kumite</div>
    </div>

    <div class="side">OLYMPIC</div>

    <div class="badge">
      <div class="rings"><span></span><span></span><span></span><span></span><span></span></div>
      <b>БРОНЗА</b>
      <small>Олимпийские<br>игры</small>
    </div>

    <div class="content">
      <div class="kicker">Приглашаем на</div>
      <h1>Мастер-класс<span class="accent">по каратэ</span></h1>

      <div class="person">
        <div class="name">София Берульцева</div>
        <div class="title"><strong>Бронзовый призёр Олимпийских игр</strong> по каратэ</div>
      </div>

      <div class="place">
        <div class="pin">
          <svg viewBox="0 0 24 24" fill="#1c0940"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </div>
        <div>
          <div class="label">Место проведения</div>
          <div class="value">NEOTECH SCHOOL</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
